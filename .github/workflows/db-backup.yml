name: Daily Supabase Database Backup to S3 (ParsPack)

on:
  schedule:
    # 01:00 Iran time — 21:30 UTC
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Supabase DB to ParsPack S3
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      AWS_EC2_METADATA_DISABLED: true

      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

    steps:
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create database backup
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          backup_dir="$(mktemp -d)"
          echo "BACKUP_DIR=$backup_dir" >> "$GITHUB_ENV"

          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          backup_name="odar-supabase-${timestamp}-${GITHUB_RUN_ID}.tar.gz"

          echo "Dumping roles..."
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --role-only \
            -f "$backup_dir/roles.sql"

          echo "Dumping schema..."
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f "$backup_dir/schema.sql"

          echo "Dumping data..."
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            --data-only \
            --use-copy \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes" \
            -f "$backup_dir/data.sql"

          test -s "$backup_dir/roles.sql"
          test -s "$backup_dir/schema.sql"
          test -s "$backup_dir/data.sql"

          (
            cd "$backup_dir"
            sha256sum roles.sql schema.sql data.sql > SHA256SUMS
            tar -czf "$backup_name" roles.sql schema.sql data.sql SHA256SUMS
          )

          filesize="$(stat -c%s "$backup_dir/$backup_name")"

          echo "BACKUP_FILE=$backup_name" >> "$GITHUB_ENV"
          echo "FILESIZE=$filesize" >> "$GITHUB_ENV"

          echo "Backup created successfully: $backup_name ($filesize bytes)"

      - name: Upload backup to ParsPack
        shell: bash
        run: |
          set -Eeuo pipefail

          endpoint="$S3_ENDPOINT"
          if [[ "$endpoint" != http://* && "$endpoint" != https://* ]]; then
            endpoint="https://$endpoint"
          fi

          aws configure set default.s3.signature_version s3v4
          aws configure set default.s3.addressing_style path

          object_key="backups/$(date -u +'%Y/%m/%d')/$BACKUP_FILE"

          aws s3 cp \
            "$BACKUP_DIR/$BACKUP_FILE" \
            "s3://$S3_BUCKET_NAME/$object_key" \
            --endpoint-url "$endpoint" \
            --no-progress

          aws s3api head-object \
            --bucket "$S3_BUCKET_NAME" \
            --key "$object_key" \
            --endpoint-url "$endpoint" \
            > /dev/null

          echo "Backup uploaded and verified: $object_key"

      - name: Send success SMS via Kavenegar
        if: success()
        env:
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
        run: |
          if [ -n "$KAVENEGAR_API_KEY" ] && [ -n "$ADMIN_PHONE" ]; then
            size_kb=$((FILESIZE / 1024))
            message="سامانه اُدار: بکاپ دیتابیس با موفقیت انجام شد.%0Aفایل: ${BACKUP_FILE}%0Aحجم: ${size_kb} کیلوبایت"

            curl --fail --silent --show-error -X POST \
              "https://api.kavenegar.com/v1/${KAVENEGAR_API_KEY}/sms/send.json" \
              -d "receptor=${ADMIN_PHONE}" \
              -d "message=${message}"
          fi

      - name: Send failure SMS via Kavenegar
        if: failure()
        env:
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
        run: |
          if [ -n "$KAVENEGAR_API_KEY" ] && [ -n "$ADMIN_PHONE" ]; then
            curl --silent -X POST \
              "https://api.kavenegar.com/v1/${KAVENEGAR_API_KEY}/sms/send.json" \
              -d "receptor=${ADMIN_PHONE}" \
              -d "message=هشدار سامانه اُدار: بکاپ شبانه دیتابیس ناموفق بود. GitHub Actions را بررسی کنید."
          fi

      - name: Clean temporary files
        if: always()
        run: |
          if [ -n "${BACKUP_DIR:-}" ]; then
            rm -rf "$BACKUP_DIR"
          fi
