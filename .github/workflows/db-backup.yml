name: Daily Supabase Database Backup to S3 (ParsPack)

on:
  schedule:
    # 01:00 Iran time — 21:30 UTC
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: Send backup result SMS
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Supabase DB to ParsPack S3
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-west-2
      AWS_EC2_METADATA_DISABLED: true

      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

    steps:
      - name: Check out backup verification scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.119.0

      - name: Create database backup
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          backup_dir="$(mktemp -d)"
          echo "BACKUP_DIR=$backup_dir" >> "$GITHUB_ENV"
          # Dumping a remote database does not need the app's local Auth hooks.
          # Keep CLI configuration independent of development-only hook secrets.
          mkdir "$backup_dir/supabase"
          printf 'project_id = "odar-backup"\n[db]\nmajor_version = 17\n' > "$backup_dir/supabase/config.toml"

          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          backup_name="odar-supabase-${timestamp}-${GITHUB_RUN_ID}.tar.gz"

          echo "Dumping roles..."
          supabase db dump \
            --workdir "$backup_dir" \
            --db-url "$SUPABASE_DB_URL" \
            --role-only \
            -f "$backup_dir/roles.sql"

          echo "Dumping schema..."
          supabase db dump \
            --workdir "$backup_dir" \
            --db-url "$SUPABASE_DB_URL" \
            -f "$backup_dir/schema.sql"

          echo "Dumping data..."
          supabase db dump \
            --workdir "$backup_dir" \
            --db-url "$SUPABASE_DB_URL" \
            --data-only \
            --use-copy \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes" \
            -f "$backup_dir/data.sql"

          test -s "$backup_dir/roles.sql"
          test -s "$backup_dir/schema.sql"
          test -s "$backup_dir/data.sql"

          (
            cd "$backup_dir"
            sha256sum roles.sql schema.sql data.sql > SHA256SUMS
            tar -czf "$backup_name" roles.sql schema.sql data.sql SHA256SUMS
          )

          filesize="$(stat -c%s "$backup_dir/$backup_name")"

          echo "BACKUP_FILE=$backup_name" >> "$GITHUB_ENV"
          echo "FILESIZE=$filesize" >> "$GITHUB_ENV"

          echo "Backup created successfully: $backup_name ($filesize bytes)"

      - name: Upload and verify backup in ParsPack
        id: upload
        shell: bash
        run: |
          set -Eeuo pipefail

          endpoint="$S3_ENDPOINT"
          if [[ "$endpoint" != https://* ]]; then
            if [[ "$endpoint" == http://* ]]; then
              echo "::error::Backup endpoint must use HTTPS."
              exit 1
            fi
            endpoint="https://$endpoint"
          fi

          aws configure set default.s3.signature_version s3v4
          aws configure set default.s3.addressing_style path

          object_key="backups/$(date -u +'%Y/%m/%d')/$BACKUP_FILE"

          aws s3 cp \
            "$BACKUP_DIR/$BACKUP_FILE" \
            "s3://$S3_BUCKET_NAME/$object_key" \
            --endpoint-url "$endpoint" \
            --no-progress

          aws s3api head-object \
            --bucket "$S3_BUCKET_NAME" \
            --key "$object_key" \
            --endpoint-url "$endpoint" \
            > /dev/null

          downloaded="$BACKUP_DIR/downloaded.tar.gz"
          aws s3 cp "s3://$S3_BUCKET_NAME/$object_key" "$downloaded" \
            --endpoint-url "$endpoint" --no-progress
          cmp "$BACKUP_DIR/$BACKUP_FILE" "$downloaded"
          python3 scripts/restore_public.py "$downloaded"
          echo "Backup uploaded, downloaded and verified: $object_key"

      - name: Test restore in an isolated local database
        id: restore
        run: python3 scripts/verify_backup_restore.py "$BACKUP_DIR/downloaded.tar.gz"

      - name: Send success notification
        if: success() && (github.event_name == 'schedule' || inputs.notify)
        continue-on-error: true
        env:
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
        run: python3 scripts/backup_notification.py success

      - name: Send backup or verification failure notification
        if: failure() && steps.restore.conclusion != 'success' && (github.event_name == 'schedule' || inputs.notify)
        continue-on-error: true
        env:
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
        run: python3 scripts/backup_notification.py failure

      - name: Clean temporary files
        if: always()
        run: |
          if [ -n "${BACKUP_DIR:-}" ]; then
            rm -rf "$BACKUP_DIR"
          fi
