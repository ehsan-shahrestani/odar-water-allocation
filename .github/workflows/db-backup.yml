name: Daily Supabase Database Backup to S3 (ParsPack)

on:
  schedule:
    # Runs every night at 21:30 UTC (01:00 AM Iran Standard Time)
    - cron: '30 21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

jobs:
  backup:
    name: Backup Supabase DB to ParsPack S3
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL 17 Client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17

      - name: Create Database Backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          BACKUP_DATE=$(date +'%Y_%m_%d_%H%M%S')
          BACKUP_FILE="odar_backup_${BACKUP_DATE}.sql.gz"
          echo "BACKUP_FILE=${BACKUP_FILE}" >> $GITHUB_ENV

          echo "Starting pg_dump from Supabase..."
          pg_dump "${SUPABASE_DB_URL}" \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges | gzip > "${BACKUP_FILE}"

          FILESIZE=$(stat -c%s "${BACKUP_FILE}")
          echo "FILESIZE=${FILESIZE}" >> $GITHUB_ENV
          echo "Backup generated successfully: ${BACKUP_FILE} (${FILESIZE} bytes)"

      - name: Upload Backup to S3 Object Storage (ParsPack)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY || secrets.LIARA_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY || secrets.LIARA_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT || secrets.LIARA_ENDPOINT }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || secrets.LIARA_BUCKET_NAME }}
        run: |
          echo "Configuring AWS CLI for S3..."
          aws configure set default.s3.signature_version s3v4

          # Ensure endpoint has protocol
          ENDPOINT="${S3_ENDPOINT}"
          if [[ "${ENDPOINT}" != http://* && "${ENDPOINT}" != https://* ]]; then
            ENDPOINT="https://${ENDPOINT}"
          fi

          echo "Uploading ${BACKUP_FILE} to s3://${S3_BUCKET_NAME}/backups/${BACKUP_FILE}..."
          aws --endpoint-url "${ENDPOINT}" s3 cp "${BACKUP_FILE}" "s3://${S3_BUCKET_NAME}/backups/${BACKUP_FILE}"

          echo "Backup uploaded successfully to Object Storage!"

      - name: Send Success SMS via Kavenegar
        if: success()
        env:
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
        run: |
          if [ -n "${KAVENEGAR_API_KEY}" ] && [ -n "${ADMIN_PHONE}" ]; then
            SIZE_KB=$((${FILESIZE} / 1024))
            MESSAGE="سامانه اُدار: پشتیبان‌گیری دیتابیس با موفقیت انجام شد.%0Aفایل: ${BACKUP_FILE}%0Aحجم: ${SIZE_KB} کیلوبایت%0Aمحل ذخیره: فضای ابری پارس‌پک"
            curl -s -X POST "https://api.kavenegar.com/v1/${KAVENEGAR_API_KEY}/sms/send.json" \
              -d "receptor=${ADMIN_PHONE}" \
              -d "message=${MESSAGE}"
            echo "Success SMS notification sent to ${ADMIN_PHONE}"
          else
            echo "KAVENEGAR_API_KEY or ADMIN_PHONE is not configured. Skipping SMS."
          fi

      - name: Send Failure SMS Alert via Kavenegar
        if: failure()
        env:
          KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
        run: |
          if [ -n "${KAVENEGAR_API_KEY}" ] && [ -n "${ADMIN_PHONE}" ]; then
            MESSAGE="هشدار سامانه اُدار: پشتیبان‌گیری شبانه دیتابیس با خطا مواجه شد! لطفاً بخش GitHub Actions را بررسی کنید."
            curl -s -X POST "https://api.kavenegar.com/v1/${KAVENEGAR_API_KEY}/sms/send.json" \
              -d "receptor=${ADMIN_PHONE}" \
              -d "message=${MESSAGE}"
            echo "Failure SMS alert sent to ${ADMIN_PHONE}"
          fi
